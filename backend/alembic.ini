[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Runtime URL is supplied from backend/.env by backend/alembic/env.py.
sqlalchemy.url = postgresql+psycopg://postgres:PASSWORD@localhost:5432/sane

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S